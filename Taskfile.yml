version: "3"

vars:
  MIGRATIONS_DIR: db/migrations
  DB_PATH: "${SWAMP_DB_PATH:-./swamp.db}"

tasks:
  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -l -w .

  fmt:check:
    desc: Fail if any Go source file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run ./...

  hooks:install:
    desc: Point git at the repo's version-controlled hooks (run once per clone)
    cmds:
      - git config core.hooksPath .githooks

  sqlc:generate:
    desc: Regenerate store/db from db/queries + db/migrations
    cmds:
      - go tool sqlc generate

  migrate:up:
    desc: Apply all pending migrations to the local sqlite db
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} sqlite3 "{{.DB_PATH}}" up

  migrate:down:
    desc: Roll back the most recently applied migration
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} sqlite3 "{{.DB_PATH}}" down

  migrate:status:
    desc: Show migration status for the local sqlite db
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} sqlite3 "{{.DB_PATH}}" status

  db:backup:
    desc: "Back up the sqlite db to <db>.<UTC time>.bak and check it (safe while swamp is running)"
    preconditions:
      - sh: command -v sqlite3
        msg: "sqlite3 not found; it ships with macOS, or install it"
      # sqlite3 would create an empty db at a wrong path and back that up.
      - sh: test -f "{{.DB_PATH}}"
        msg: "no database at {{.DB_PATH}} (set SWAMP_DB_PATH, e.g. via direnv exec .)"
    cmds:
      # .backup, not cp: a copy of the file alone misses writes still in the WAL.
      - |
        backup="{{.DB_PATH}}.$(date -u +%Y%m%dT%H%M%SZ).bak"
        sqlite3 "{{.DB_PATH}}" ".backup '$backup'"
        result=$(sqlite3 "$backup" "PRAGMA integrity_check;")
        if [ "$result" != "ok" ]; then
          echo "backup $backup failed its integrity check: $result"
          exit 1
        fi
        echo "backed up {{.DB_PATH}} to $backup"

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  build:
    desc: Build the swamp binary to ./bin/swamp
    cmds:
      - go build -o bin/swamp ./cmd/swamp

  migrate:
    desc: "Apply database migrations with the built binary (run after upgrading; the other commands refuse an out-of-date database)"
    cmds:
      - ./bin/swamp migrate

  run:
    desc: Run the swamp binary with the local sqlite db, migrating it first
    deps: [migrate]
    cmds:
      - ./bin/swamp

  mcp-serve:
    desc: "Run swamp as an MCP server over Streamable HTTP (SWAMP_MCP_ADDR, default 127.0.0.1:8787), migrating the database first"
    deps: [migrate]
    cmds:
      - ./bin/swamp mcp-serve
