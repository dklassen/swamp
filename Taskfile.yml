version: "3"

vars:
  MIGRATIONS_DIR: db/migrations
  DB_PATH: "${SWAMP_DB_PATH:-./swamp.db}"

tasks:
  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -l -w .

  fmt:check:
    desc: Fail if any Go source file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run ./...

  hooks:install:
    desc: Point git at the repo's version-controlled hooks (run once per clone)
    cmds:
      - git config core.hooksPath .githooks

  sqlc:generate:
    desc: Regenerate store/db from db/queries + db/migrations
    cmds:
      - go tool sqlc generate

  migrate:up:
    desc: Apply all pending migrations to the local sqlite db
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} sqlite3 "{{.DB_PATH}}" up

  migrate:down:
    desc: Roll back the most recently applied migration
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} sqlite3 "{{.DB_PATH}}" down

  migrate:status:
    desc: Show migration status for the local sqlite db
    cmds:
      - go tool goose -dir {{.MIGRATIONS_DIR}} sqlite3 "{{.DB_PATH}}" status

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  build:
    desc: Build the swamp binary to ./bin/swamp
    cmds:
      - go build -o bin/swamp ./cmd/swamp

  run:
    desc: Run the swamp binary with the local sqlite db
    cmds:
      - ./bin/swamp
