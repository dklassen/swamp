version: "2"

linters:
  default: standard
  enable:
    # complexity
    - maintidx
    # errors
    - errchkjson
    - errname
    - errorlint
    - nilerr
    - nilnil
    # bugs and idioms
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - gocheckcompilerdirectives
    - godot
    - intrange
    - makezero
    - misspell
    - modernize
    - nakedret
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - reassign
    - rowserrcheck
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    modernize:
      disable:
        # An embedded struct's literal shows which fields form that unit.
        - embedlit
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Table-driven tests are long by design.
      - path: _test\.go
        linters: [maintidx]
      # A test is cancelled only as it ends, so its context buys nothing.
      - path: _test\.go
        linters: [noctx]

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
