version: "2"

linters:
  default: standard
  enable:
    # complexity
    - maintidx
    # errors
    - errchkjson
    - errname
    - errorlint
    - nilerr
    - nilnil
    # bugs and idioms
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - godot
    - intrange
    - makezero
    - misspell
    - modernize
    - nakedret
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - reassign
    - rowserrcheck
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    exhaustive:
      # A default case states that every other value is handled the same way.
      default-signifies-exhaustive: true
    modernize:
      disable:
        # An embedded struct's literal shows which fields form that unit.
        - embedlit
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Table-driven tests are long by design.
      - path: _test\.go
        linters: [maintidx]
      # A test is cancelled only as it ends, so its context buys nothing.
      - path: _test\.go
        linters: [noctx]
      # Tests write throwaway files under t.TempDir and build no command or path from input.
      - path: _test\.go
        linters: [gosec]
      # Launching the user's own editor and browser is the point.
      - linters: [gosec]
        text: "G204|G702"
      # Paths come from swamp's config or documents.Path, which builds them from typed IDs.
      - linters: [gosec]
        text: "G304|G703"

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
