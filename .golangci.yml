version: "2"

linters:
  default: standard
  enable:
    # complexity; not cyclop, which counts each case of a key switch as a branch
    - funlen
    - gocognit
    - maintidx
    - nestif
    # errors
    - errchkjson
    - errname
    - errorlint
    - nilerr
    - nilnil
    # bugs and idioms
    - bodyclose
    - contextcheck
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gosec
    - godot
    - iface
    - intrange
    - makezero
    - misspell
    - modernize
    - musttag
    - nakedret
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    funlen:
      lines: 80
      statements: 50
    exhaustive:
      # A default case states that every other value is handled the same way.
      default-signifies-exhaustive: true
    modernize:
      disable:
        # An embedded struct's literal shows which fields form that unit.
        - embedlit
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        # Names are exported for swamp's own packages, not a public API; see docs/issues/lint.
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Table-driven tests are long by design.
      - path: _test\.go
        linters: [funlen, gocognit, maintidx]
      # A failed assertion in a test already fails it, naming both types.
      - path: _test\.go
        linters: [forcetypeassert]
      # A test's literals are fixtures that read best where they're used.
      - path: _test\.go
        linters: [goconst]
      # The change log lists the schema's own names, checked against it by its tests.
      - path: db/migrations/changelog\.go
        linters: [goconst]
      # Each enum has its own name table; a shared name doesn't tie them together.
      - path: tui/message/names\.go
        linters: [goconst]
      # A test is cancelled only as it ends, so its context buys nothing.
      - path: _test\.go
        linters: [noctx]
      # Tests write throwaway files under t.TempDir and build no command or path from input.
      - path: _test\.go
        linters: [gosec]
      # A test's allocations aren't its point, and sizing a slice up front turns a nil want into [] for cmp.Diff.
      - path: _test\.go
        linters: [prealloc]
      # fpdf reads margins only as all four at once.
      - linters: [dogsled]
        source: 'GetMargins\(\)'
      # The CLI's output is its job; anywhere else a print garbles the TUI's screen.
      - path: cmd/swamp/
        linters: [forbidigo]
      # Launching the user's own editor and browser is the point.
      - linters: [gosec]
        text: "G204|G702"
      # Paths come from swamp's config or documents.Path, which builds them from typed IDs.
      - linters: [gosec]
        text: "G304|G703"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      # Standard library, then other modules, then swamp's own packages.
      sections: [standard, default, localmodule]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
